<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paystack Checkout Simulator - Olaslog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .paystack-card {
            background: #ffffff;
            color: #1e293b;
            border-radius: 16px;
            max-width: 440px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .paystack-header {
            background: #0ba4db;
            color: white;
            padding: 1.5rem;
            text-align: center;
            position: relative;
        }
        .paystack-body {
            padding: 1.75rem;
        }
        .badge-sim {
            background: #fef3c7;
            color: #b45309;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 0.5rem;
        }
        .amount-display {
            font-size: 2rem;
            font-weight: 800;
            color: #0ba4db;
            margin: 0.5rem 0;
        }
        .pay-channel-list {
            display: flex;
            gap: 0.5rem;
            margin: 1.25rem 0;
        }
        .channel-btn {
            flex: 1;
            padding: 0.6rem;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
            text-align: center;
        }
        .channel-btn.active {
            border-color: #0ba4db;
            color: #0ba4db;
            background: #f0f9ff;
        }
    </style>
</head>
<body>

    <div class="paystack-card">
        <div class="paystack-header">
            <span class="badge-sim">PAYSTACK TEST MODE SIMULATOR</span>
            <h2>Olaslog Wallet Top-up</h2>
            <p id="userEmail" style="font-size: 0.9rem; opacity: 0.9;">customer@olaslog.com</p>
        </div>

        <div class="paystack-body">
            <div style="text-align: center;">
                <p style="font-size: 0.85rem; color: #64748b;">Funding Amount</p>
                <div class="amount-display" id="amountDisplay">₦0.00</div>
                <p style="font-size: 0.78rem; color: #94a3b8;">Reference: <span id="refDisplay" style="font-family: monospace;">---</span></p>
            </div>

            <div class="pay-channel-list">
                <div class="channel-btn active" onclick="selectChannel(this, 'card')">💳 Card</div>
                <div class="channel-btn" onclick="selectChannel(this, 'transfer')">🏦 Transfer</div>
                <div class="channel-btn" onclick="selectChannel(this, 'ussd')">📱 USSD</div>
            </div>

            <div id="cardDetails" style="background: #f1f5f9; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.85rem; color: #475569;">
                <div><strong>Simulated Card:</strong> 4084 0800 0000 0001</div>
                <div><strong>Expiry:</strong> 12/28 | <strong>CVV:</strong> 408</div>
            </div>

            <button id="paySuccessBtn" class="btn btn-emerald" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-bottom: 0.75rem;" onclick="simulatePayment(true)">
                Simulate Successful Payment ⚡
            </button>

            <button class="btn btn-secondary" style="width: 100%; color: #dc2626; border-color: #fecaca; background: #fff1f2;" onclick="simulatePayment(false)">
                Simulate Cancel / Failure
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('reference') || 'WAL-' + Date.now();
        const amount = parseFloat(urlParams.get('amount') || '1000');
        const email = urlParams.get('email') || 'customer@olaslog.com';

        document.getElementById('refDisplay').textContent = ref;
        document.getElementById('amountDisplay').textContent = '₦' + amount.toLocaleString();
        document.getElementById('userEmail').textContent = email;

        function selectChannel(el, channel) {
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            const cardBox = document.getElementById('cardDetails');
            if (channel === 'card') {
                cardBox.innerHTML = '<div><strong>Simulated Card:</strong> 4084 0800 0000 0001</div><div><strong>Expiry:</strong> 12/28 | <strong>CVV:</strong> 408</div>';
            } else if (channel === 'transfer') {
                cardBox.innerHTML = '<div><strong>Bank:</strong> Wema Bank / Paystack Virtual</div><div><strong>Account:</strong> 9928192841</div><div><strong>Name:</strong> Olaslog - ' + ref + '</div>';
            } else {
                cardBox.innerHTML = '<div><strong>USSD Code:</strong> *737*000*4928#</div>';
            }
        }

        async function simulatePayment(isSuccess) {
            const btn = document.getElementById('paySuccessBtn');
            btn.disabled = true;
            btn.textContent = 'Verifying with Olaslog Server...';

            if (isSuccess) {
                try {
                    const res = await fetch(`/api/wallet/verify/${encodeURIComponent(ref)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await res.json();
                    if (data.success) {
                        alert(`🎉 Payment of ₦${amount.toLocaleString()} Confirmed!\nYour wallet balance is now updated.`);
                        window.location.href = '/#wallet';
                    } else {
                        alert('Verification error: ' + data.error);
                        window.location.href = '/#wallet';
                    }
                } catch (err) {
                    alert('Network error connecting to Olaslog server');
                    window.location.href = '/#wallet';
                }
            } else {
                alert('Payment cancelled or simulated failed.');
                window.location.href = '/#wallet';
            }
        }
    </script>
</body>
</html>
